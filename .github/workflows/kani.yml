name: Kani (formal verification)

# Runs the Kani bounded model checker over the verifier's harnesses
# (`#[cfg(kani)] mod proofs` in crates/verifier/src/verifier.rs). These
# discharge, over *all* inputs:
#   * `le_lt` is a correct 256-bit LE comparison,
#   * `scalar_is_canonical(s) ⇔ s < r`,
#   * `fq_is_canonical(c) ⇔ c < q`  (the non-malleability core),
#   * `coords_canonical` = conjunction of the per-coordinate checks,
#   * fail-closed structural / arity / non-malleability rejections,
#   * **totality**: no panic / no OOB / no overflow over the full
#     `verify_groth16` + `verify_proof_only` body (curve ops swapped via
#     `kani::stub` since BN254 pairing/scalar-mul is not symbolically
#     executable inside Kani's budget), and
#   * pairing operand-assembly: the byte buffer presented to the
#     `alt_bn128_pairing` syscall equals the canonical
#     `neg(A) || B || α || β || vk_x || γ || C || δ`.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  kani:
    name: prove (verifier)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add 8 GB swap (CBMC working set spikes past 7 GB)
        # `ubuntu-latest` has 7 GB RAM. The heavier rejection / totality
        # harnesses symbolically execute the full `verify_groth16` body
        # with the kani::stub'd curve ops, and CBMC's GOTO+SAT working
        # set exceeds the cgroup limit (the runner gets a SIGTERM,
        # surfaced as "received a shutdown signal" + exit 143). Swap
        # absorbs the spike — slower but doesn't crash.
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.kani
            target
          key: ${{ runner.os }}-kani-${{ hashFiles('Cargo.lock') }}

      - name: Install Kani
        # The action wrapper does this for us, but we need direct control
        # over cargo-kani invocations to run each harness in its own
        # process. The cargo install is fast on a warm cache.
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      - name: Run each harness in its own cargo-kani process
        # Why per-harness: passing all 24 harnesses to one cargo-kani
        # invocation OOM-kills `ubuntu-latest` (7 GB) at ~10 harnesses
        # because cargo-kani driver state grows monotonically. Sharding
        # via `--harness` filters hit a Kani 0.67 bug where multi-flag
        # invocations silently drop most filters — e.g. four `--exact
        # --harness X --harness Y --harness Z --harness W` calls
        # reproducibly matched only 0–2 of the four. One harness per
        # cargo-kani call sidesteps both: memory is reclaimed between
        # invocations and there's nothing for the filter logic to drop.
        run: |
          set -e
          harnesses=(
            verifier::proofs::le_lt_is_correct_u256_compare
            verifier::proofs::scalar_is_canonical_iff_lt_r
            verifier::proofs::fq_is_canonical_iff_lt_q
            verifier::proofs::coords_canonical_is_conjunction
            verifier::proofs::proof_wrong_length_rejected
            verifier::proofs::vk_truncated_rejected
            verifier::proofs::vk_ic_unaligned_rejected
            verifier::proofs::pi_unaligned_rejected
            verifier::proofs::arity_mismatch_rejected_ic2_pi0
            verifier::proofs::arity_mismatch_rejected_ic2_pi2
            verifier::proofs::noncanonical_pi_rejected
            verifier::proofs::strict_rejects_top_bit_set_in_vk
            verifier::proofs::strict_rejects_top_bit_set_in_proof
            verifier::proofs::proof_only_too_short_rejected
            verifier::proofs::pairing_operand_assembly_order
            verifier::proofs::pairing_operand_assembly
            verifier::proofs::verify_groth16_totality_n0
            verifier::proofs::verify_groth16_totality_n1
            verifier::proofs::verify_groth16_totality_n2
            verifier::proofs::verify_groth16_strict_totality_n0
            verifier::proofs::verify_groth16_strict_totality_n1
            verifier::proofs::verify_groth16_strict_totality_n2
            verifier::proofs::totality_verify_groth16
            verifier::proofs::totality_verify_proof_only
          )
          failed=()
          for h in "${harnesses[@]}"; do
            echo "::group::Kani harness: $h"
            if cargo-kani -p xark-verifier -Z stubbing --exact --harness "$h"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::Kani harness failed: $h"
              failed+=("$h")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} harness(es) failed:"
            printf '  - %s\n' "${failed[@]}"
            exit 1
          fi
          echo "All ${#harnesses[@]} Kani harnesses verified."

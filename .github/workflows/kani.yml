name: Kani (formal verification)

# Runs the Kani bounded model checker over the verifier's harnesses
# (`#[cfg(kani)] mod proofs` in crates/verifier/src/verifier.rs). These
# discharge, over *all* inputs:
#   * `le_lt` is a correct 256-bit LE comparison,
#   * `scalar_is_canonical(s) ⇔ s < r`,
#   * `fq_is_canonical(c) ⇔ c < q`  (the non-malleability core),
#   * `coords_canonical` = conjunction of the per-coordinate checks,
#   * fail-closed structural / arity / non-malleability rejections,
#   * **totality**: no panic / no OOB / no overflow over the full
#     `verify_groth16` + `verify_proof_only` body (curve ops swapped via
#     `kani::stub` since BN254 pairing/scalar-mul is not symbolically
#     executable inside Kani's budget), and
#   * pairing operand-assembly: the byte buffer presented to the
#     `alt_bn128_pairing` syscall equals the canonical
#     `neg(A) || B || α || β || vk_x || γ || C || δ`.
#
# Kani auto-discovers every `#[kani::proof]` in the crate, so the harness list
# below is informational only:
#   le_lt_is_correct_u256_compare, scalar_is_canonical_iff_lt_r,
#   fq_is_canonical_iff_lt_q, coords_canonical_is_conjunction,
#   proof_wrong_length_rejected, vk_truncated_rejected,
#   vk_ic_unaligned_rejected, pi_unaligned_rejected,
#   arity_mismatch_rejected_ic2_pi0, arity_mismatch_rejected_ic2_pi2,
#   noncanonical_pi_rejected, strict_rejects_top_bit_set_in_vk,
#   strict_rejects_top_bit_set_in_proof, proof_only_too_short_rejected,
#   verify_groth16_totality_n{0,1,2}, verify_groth16_strict_totality_n{0,1,2},
#   pairing_operand_assembly_order,
#   totality_verify_groth16, totality_verify_proof_only,
#   pairing_operand_assembly.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  kani:
    # Sharded across three matrix legs so each runner gets a fresh 7 GB
    # of RAM. Running all 24 harnesses in one `cargo-kani` invocation
    # OOM-kills `ubuntu-latest` (exit code 143) — CBMC forks per
    # harness, but the cargo-kani driver accumulates GOTO/AST state
    # across iterations and crosses the cgroup limit somewhere around
    # the 10th totality proof.
    name: prove (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier 1: canonicality + rejection paths + pairing operand
          # assembly. 16 cheap harnesses, ~3 min total.
          #
          # Use `--exact` with fully-qualified `verifier::proofs::<name>`
          # paths: Kani 0.67's substring `--harness` filter empirically
          # drops most of a wide pattern set (16 substring filters
          # collapsed to 2 matched harnesses in one earlier run). Exact
          # matching eliminates the ambiguity.
          - group: canonicality
            harnesses: >-
              --exact
              --harness verifier::proofs::le_lt_is_correct_u256_compare
              --harness verifier::proofs::scalar_is_canonical_iff_lt_r
              --harness verifier::proofs::fq_is_canonical_iff_lt_q
              --harness verifier::proofs::coords_canonical_is_conjunction
              --harness verifier::proofs::proof_wrong_length_rejected
              --harness verifier::proofs::vk_truncated_rejected
              --harness verifier::proofs::vk_ic_unaligned_rejected
              --harness verifier::proofs::pi_unaligned_rejected
              --harness verifier::proofs::arity_mismatch_rejected_ic2_pi0
              --harness verifier::proofs::arity_mismatch_rejected_ic2_pi2
              --harness verifier::proofs::noncanonical_pi_rejected
              --harness verifier::proofs::strict_rejects_top_bit_set_in_vk
              --harness verifier::proofs::strict_rejects_top_bit_set_in_proof
              --harness verifier::proofs::proof_only_too_short_rejected
              --harness verifier::proofs::pairing_operand_assembly_order
              --harness verifier::proofs::pairing_operand_assembly
          # Tier 2: small-input totality (n=0, n=1). ~3 min, ~3 GB
          # resident at peak.
          - group: totality_small
            harnesses: >-
              --exact
              --harness verifier::proofs::verify_groth16_totality_n0
              --harness verifier::proofs::verify_groth16_totality_n1
              --harness verifier::proofs::verify_groth16_strict_totality_n0
              --harness verifier::proofs::verify_groth16_strict_totality_n1
          # Tier 3: large-input totality (n=2 + full-body totality).
          # The heaviest CBMC bodies; isolating them on their own
          # runner is what stops the OOM cascade.
          - group: totality_large
            harnesses: >-
              --exact
              --harness verifier::proofs::verify_groth16_totality_n2
              --harness verifier::proofs::verify_groth16_strict_totality_n2
              --harness verifier::proofs::totality_verify_groth16
              --harness verifier::proofs::totality_verify_proof_only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Kani
        uses: model-checking/kani-github-action@v1
        with:
          # `kani::stub` is an unstable feature. Newer Kani versions
          # dropped `--enable-unstable` and require the feature flag
          # directly; without `-Z stubbing` the proofs reject at codegen
          # with "Using the stub attribute requires activating the
          # unstable `stubbing` feature".
          args: '-p xark-verifier -Z stubbing ${{ matrix.harnesses }}'

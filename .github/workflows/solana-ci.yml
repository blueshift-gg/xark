name: Solana E2E

# Roadmap step **E.2.d** — end-to-end on-chain verification harness.
#
# This workflow runs the Mollusk-driven SBF integration tests for the
# `xark-solana-verifier` program. Mollusk only accepts SBF ELF binaries
# (no host-side Rust processor API exists), so this job installs the Anza
# Solana toolchain and runs `cargo build-sbf` before `cargo test`. The
# main `ci.yml` workflow does not need the Solana toolchain because the
# Mollusk tests are gated behind the `ark-backend` feature *and* the
# harness skips when the SBF ELF is absent.

on:
  push:
    paths:
      - "crates/xark-solana-verifier/**"
      - "crates/groth16-backend/src/solana.rs"
      - ".github/workflows/solana-ci.yml"
  pull_request:
    paths:
      - "crates/xark-solana-verifier/**"
      - "crates/groth16-backend/src/solana.rs"
      - ".github/workflows/solana-ci.yml"

jobs:
  mollusk-e2e:
    name: mollusk on-chain verifier tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: solana-${{ hashFiles('Cargo.lock') }}

      - name: Install Solana CLI (provides cargo-build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build SBF program
        working-directory: crates/xark-solana-verifier
        run: cargo build-sbf

      - name: Run on-chain verifier tests (release)
        # Release-mode mandatory: the `verify_arithmetic_square_proof_via_ark_backend`
        # test runs a real Groth16 prove + verify, which is unusably slow in debug.
        run: cargo test -p xark-solana-verifier --features ark-backend --release

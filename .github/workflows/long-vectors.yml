name: Long Vectors (nightly)

# Nightly job that exercises the ignored BLAKE3 long-input KAT batch
# (6144 / 6145 / 7168 / 7169 / 8192 / 8193 byte messages from the official
# BLAKE3 `test_vectors.json`). Each input runs the in-circuit gadget over
# 7–9 chunks (~100k constraints each in release), so the full ignored batch
# wall-clock is ~30–60 minutes on `ubuntu-latest`. Gated behind a nightly
# cadence rather than every-push CI so the default `cargo test --release`
# stays under a reasonable per-PR budget.
#
# To exercise the same batch locally:
#   cargo test --release -p xark-tests --test nist_rfc_vectors -- --ignored
#
# `workflow_dispatch` is also wired so the job can be re-run on demand.

on:
  schedule:
    # 03:00 UTC daily — runs ahead of the fuzz-nightly job (04:00 UTC) so
    # the two never contend for the same GHA runner pool window.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  long-vectors:
    name: BLAKE3 long-input KAT batch (--ignored)
    runs-on: blueshift-runners
    # Generous ceiling: the ignored batch is ~30–60 minutes in release; allow
    # headroom for runner cold-start, dep compile, and noisy-neighbour drift.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ hashFiles('Cargo.lock') }}-long-vectors

      - name: cargo test (release, --ignored) — BLAKE3 long-input batch
        # Release mode is mandatory: the BLAKE3 gadget is 10–20× slower in
        # debug, which would push this from "~30–60 min" to multi-hour and
        # blow the timeout.
        run: cargo test --release -p xark-tests --test nist_rfc_vectors -- --ignored

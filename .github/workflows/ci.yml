name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust toolchain
        # wasm32: the CLI end-to-end tests build circuits with `xark build`.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ hashFiles('Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Every crate can publish
        # No publishable crate depends on an unpublished one or on a path alone, and
        # their dependencies have an order.
        run: cargo xtask publish --plan

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo doc
        # Broken doc links and examples fail: what docs.rs would render broken.
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps --workspace --exclude xark-wasm
          cargo doc --no-deps --manifest-path crates/lang/Cargo.toml

      - name: cargo test (release)
        # Release mode is mandatory here: end-to-end Groth16 setup+prove+verify
        # tests (Blake2s, AES128, SHA256, Keccak, ECDSA, ...) are 10–20× slower
        # in debug. The heaviest Groth16 e2e proves — the Ed25519 scalar-mul/EdDSA
        # and secp256k1/r1 ECDSA vectors — take longer than the per-step CI limit
        # and run in slow.yml (60-min timeout); exclude those packages here
        # rather than terminating mid-test.
        #
        # The `sbpf` and `differential_alt_bn128` integration tests under
        # `gadgets/tests/tests/` invoke `cargo build-sbf` per `#[svm_test]`;
        # they need the Anza toolchain and run in `solana-ci.yml`.
        # Build one xark-tests test list excluding those, then test.
        run: |
          cargo test --workspace --release --exclude xark-tests --exclude xark-ed25519 \
            --exclude xark-secp256k1 --exclude xark-secp256r1
          cargo test -p xark-tests --release --lib
          tests_args=()
          for t in $(ls gadgets/tests/tests/*.rs | xargs -n1 basename | sed 's/\.rs$//' \
                      | grep -vE '^(sbpf|differential_alt_bn128)'); do
            tests_args+=(--test "$t")
          done
          cargo test -p xark-tests --release "${tests_args[@]}"

  reproducible:
    # A circuit is identical (same R1CS digest) under every supported rustc. Rebuild every example with the oldest supported
    # toolchain, stable and beta, and compare with tests/stable-digests.txt; an example
    # with Rust client functions must also build its client.wasm on each.
    name: circuit reproducibility (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.89", stable, beta]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install workspace toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install toolchain under test
        # Installed, not made the default: `cargo xtask` builds with the workspace
        # toolchain (its dependencies need 1.89); only the circuits are built with
        # the toolchain under test (`--toolchain`).
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --target wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Compare circuit digests
        run: cargo xtask digests --check --toolchain ${{ matrix.toolchain }}

  msrv:
    # The minimum Rust (`rust-version`, 1.89) builds the CLI and every crate, not
    # only the circuits `reproducible` checks.
    name: builds on Rust 1.89
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: |
          cargo check --workspace --all-targets --locked
          cargo check --all-targets --locked --manifest-path crates/lang/Cargo.toml

  compiler-snapshots:
    # The snapshot suite (count bridges to the Lean models, rejection diagnostics,
    # solves) and the native-semantics fuzzer. The heavy `#[ignore]`d known-answer
    # vectors run in `slow.yml`.
    name: compiler snapshot suite + semantics fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install stable Rust + wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lang
      - name: cargo test (snapshots, semantics fuzz, input and host tests)
        # Every test in the crate: naming files here let the others go stale
        # unnoticed. The heavy KAT vectors are `#[ignore]`d (slow.yml).
        env:
          XARK_FUZZ_CASES: "200"
        run: cd crates/lang && cargo test --release --no-fail-fast

  wasm-smoke:
    # The xark-wasm prover package (`npm test` in crates/wasm): against host
    # artifacts for `examples/cube`, the wasm build must reproduce the public
    # inputs byte-for-byte; against `examples/sha256` (a 2^16 domain), the
    # streaming prover with and without workers, both key layouts, and the
    # wrong-key guard.
    name: xark-wasm smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install stable Rust + wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build xark
        run: cargo build --release -p xark-cli --bin xark

      - name: Build, set up and prove cube
        # The smoke test cross-checks the wasm-generated public inputs against
        # the host's (same circuit, same witness — must be byte-identical).
        run: |
          target/release/xark setup examples/cube --insecure-dev-mode
          target/release/xark prove examples/cube --inputs '{"secret":"3","result":"27"}'

      - name: Build sha256 and its three keys
        # The streaming test's prerequisites (crates/wasm/tests/streaming.test.cjs).
        run: |
          x=target/release/xark
          k=examples/sha256/target/xark
          $x setup examples/sha256 --insecure-dev-mode --deterministic-rng 7
          $x setup examples/sha256 --insecure-dev-mode --deterministic-rng 7 --r1cs-form reduced --out $k/sha256-streamable
          $x setup examples/sha256 --insecure-dev-mode --deterministic-rng 7 --out $k/sha256-smooth

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build xark-wasm node package
        run: cd crates/wasm && wasm-pack build --target nodejs --release --out-dir dist/node

      - name: Run xark-wasm tests
        run: cd crates/wasm && npm test

  clients:
    # `xark client` for the representative examples must match the committed
    # clients, typecheck, and prove + verify through xark-wasm (clients/check:
    # `npm test`, whose vitest setup builds xark, xark-wasm and each example).
    name: generated clients
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install stable Rust + wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated clients (cube, zkyc, sha256, merkle)
        working-directory: clients/check
        run: npm ci && npm test

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned compiler toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-03
          components: rustc-dev, llvm-tools-preview

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install pinned nightly for the xark-rustc driver
        # The xark-tests integration tests build the `xark-rustc` rustc_driver
        # (a workspace-excluded, nightly-pinned crate) via the test harness,
        # which selects it with `RUSTUP_TOOLCHAIN` — that does NOT auto-install,
        # so the pinned nightly + `rustc-dev` must be present. Installed here
        # WITHOUT `rustup default`, so stable stays the default for the workspace
        # fmt / clippy / test steps.
        run: rustup toolchain install nightly-2026-05-03 --profile minimal --component rustc-dev --component llvm-tools-preview

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ hashFiles('Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (release)
        # Release mode is mandatory here: end-to-end Groth16 setup+prove+verify
        # tests (Blake2s, AES128, SHA256, Keccak, ECDSA, ...) are 10–20× slower
        # in debug. The heaviest Groth16 e2e proves — the Ed25519 scalar-mul/EdDSA
        # and secp256k1/r1 ECDSA vectors — take longer than the per-step CI limit
        # and run in nightly-kats.yml (60-min timeout); exclude those packages here
        # rather than terminating mid-test.
        #
        # The `sbpf` and `differential_alt_bn128` integration tests under
        # `gadgets/tests/tests/` invoke `cargo build-sbf` per `#[svm_test]`;
        # they need the Anza toolchain and run in `solana-ci.yml`.
        # Build one xark-tests test list excluding those, then test.
        run: |
          cargo test --workspace --release --exclude xark-tests --exclude xark-ed25519 \
            --exclude xark-secp256k1 --exclude xark-secp256r1
          cargo test -p xark-tests --release --lib
          tests_args=()
          for t in $(ls gadgets/tests/tests/*.rs | xargs -n1 basename | sed 's/\.rs$//' \
                      | grep -vE '^(sbpf|differential_alt_bn128)'); do
            tests_args+=(--test "$t")
          done
          cargo test -p xark-tests --release "${tests_args[@]}"

  compiler-snapshots:
    name: compiler snapshot suite (nightly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned nightly (rustc_private) toolchain
        # `crates/rustc` is the `rustc_driver`, built on this pinned nightly
        # with `rustc-dev`; it is excluded from the root workspace, so the `check`
        # job's `cargo test --workspace` never builds it. The harness selects it via
        # `RUSTUP_TOOLCHAIN=nightly-2026-05-03`, so the pin here must match.
        # See docs/toolchain.md for the pin and the bump procedure.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-03
          components: rustc-dev, llvm-tools-preview, clippy

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/lang/target
            crates/rustc/target
          key: snapshots-${{ hashFiles('Cargo.lock') }}

      - name: cargo clippy (xark-rustc driver)
        # The workspace `check` job runs on stable and excludes this nightly
        # `rustc_private` crate, so lint it here where the pinned nightly +
        # `rustc-dev` are available. `--features debug` covers the diagnostic
        # paths (timing / XARK_VERIFY) too.
        run: cd crates/rustc && cargo clippy --all-targets --features debug -- -D warnings

      - name: cargo test (compiler snapshots)
        # Runs `crates/lang/tests/snapshot.rs` — the byte-identical count bridges
        # (fp_mul 1154, ec_incomplete 15369/15891, sha256 39018, blake2s 21600,
        # blake3 15248, keccak 153664, aes 145816, poseidon2 240, bignum 1189,
        # struct_point, aggregate-input + int-operator solves, …).
        #
        # The `xark-test-harness` builds every gadget crate with
        # `-Zalways-encode-mir` into an isolated `target/xark-compile` (so their
        # MIR is inlinable) and the `xark-rustc` compiler into
        # `crates/rustc/target`, then
        # compiles each example and diffs its emitted R1CS/IR against the
        # committed snapshots. The heavy `#[ignore]`d known-answer-vector tests
        # run separately in `nightly-kats.yml`.
        run: cd crates/lang && cargo test --test snapshot

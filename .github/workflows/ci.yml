name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ hashFiles('Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (release)
        # Release mode is mandatory here: end-to-end Groth16 setup+prove+verify
        # tests (Blake2s, AES128, SHA256, Keccak, ECDSA, ...) are 10–20× slower
        # in debug. Debug-mode workspace takes 10+ minutes; release ~90s.
        #
        # The `sbpf` and `differential_alt_bn128` integration tests under
        # `crates/tests/tests/` invoke `cargo build-sbf` per `#[svm_test]`;
        # they need the Anza toolchain and run in `solana-ci.yml`.
        # Build one xark-tests test list excluding those, then test.
        run: |
          cargo test --workspace --release --exclude xark-tests
          cargo test -p xark-tests --release --lib
          tests_args=()
          for t in $(ls crates/tests/tests/*.rs | xargs -n1 basename | sed 's/\.rs$//' \
                      | grep -vE '^(sbpf|differential_alt_bn128)'); do
            tests_args+=(--test "$t")
          done
          cargo test -p xark-tests --release "${tests_args[@]}"

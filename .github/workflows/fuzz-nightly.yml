name: Fuzz (cargo-fuzz nightly campaign)

# Nightly cargo-fuzz campaign. Complements `.github/workflows/fuzz.yml`,
# which is a 30–60-second smoke test on every push/PR. This job runs each
# target for a full hour to grow the corpus, surface deeper panics, and
# accumulate coverage across nightly runs via the cached corpus/artifacts.
#
# Runtime budget:
#   * artifact_parser : 3600 s
#   * witness_parser  : 3600 s
#   * lowering        : 3600 s
#   total ≈ 3 h plus dep compile + cargo-fuzz install (≈ 30 m) → 4 h ceiling.

on:
  schedule:
    # 04:00 UTC daily — staggered ~1 h after the `long-vectors` nightly so
    # the two heavy jobs do not compete for the same runner concurrency.
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  fuzz-nightly:
    name: nightly (artifact / witness / lowering parsers, 60 min each)
    runs-on: ubuntu-latest
    # 3 × 60 min fuzz + dep compile + cargo-fuzz install + corpus upload.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly Rust toolchain (cargo-fuzz needs nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry / git / fuzz build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-nightly-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-nightly-
            ${{ runner.os }}-cargo-fuzz-

      # ---------------------------------------------------------------
      # Corpus + crash-artifact caching.
      #
      # Each fuzz target maintains its own corpus directory under
      # `fuzz/corpus/<target>/` (libFuzzer adds new interesting inputs
      # during each run). We cache those directories across nightly runs
      # keyed on `github.run_id` so every nightly writes a *fresh* cache
      # entry, and `restore-keys` falls back to the most recent prior
      # entry. This is the standard "save a new entry per run, restore
      # the latest" pattern, since GHA cache entries are immutable once
      # written.
      #
      # Artifacts (`fuzz/artifacts/<target>/`) hold libFuzzer crash
      # reproducers. We cache + upload them so a regression that surfaces
      # mid-run is preserved both as a corpus seed for tomorrow and as a
      # downloadable artifact for triage.
      # ---------------------------------------------------------------
      - name: Restore fuzz corpus + artifacts
        uses: actions/cache@v4
        with:
          path: |
            fuzz/corpus
            fuzz/artifacts
          key: ${{ runner.os }}-fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-fuzz-corpus-

      - name: Install cargo-fuzz
        # See fuzz.yml: `--locked` pins a too-old `rustix` that uses
        # internal rustc attrs and fails to compile on current nightly.
        run: cargo install cargo-fuzz

      - name: Ensure corpus + artifact dirs exist
        run: |
          mkdir -p fuzz/corpus/artifact_parser fuzz/corpus/witness_parser fuzz/corpus/lowering
          mkdir -p fuzz/artifacts/artifact_parser fuzz/artifacts/witness_parser fuzz/artifacts/lowering

      - name: Run artifact_parser fuzz target (60 min)
        working-directory: fuzz
        run: cargo fuzz run artifact_parser -- -max_total_time=3600 -timeout=30

      - name: Run witness_parser fuzz target (60 min)
        working-directory: fuzz
        run: cargo fuzz run witness_parser -- -max_total_time=3600 -timeout=30

      - name: Run lowering fuzz target (60 min)
        working-directory: fuzz
        # The lowering target compiles ACIR → R1CS, so individual inputs can
        # legitimately take longer than the parsers; bump the per-input
        # timeout to 60 s to match the smoke job's relative budget.
        run: cargo fuzz run lowering -- -max_total_time=3600 -timeout=60

      # If any of the fuzz steps surfaced crashes, libFuzzer writes
      # reproducers under `fuzz/artifacts/<target>/`. Upload regardless of
      # job result so failures *and* clean runs preserve the corpus.
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ github.run_id }}
          path: |
            fuzz/artifacts/**/*
          if-no-files-found: ignore
          retention-days: 30

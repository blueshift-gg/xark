name: Scheduled checks

# Checks that can fail when nothing in this repository changes, so they run on
# a timer: a new Rust beta that would change a circuit, and the semantics fuzzer
# with a fresh seed. The slow checks of this repository's own code run on every
# pull request instead (slow.yml).

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  semantics-fuzz-long:
    # The native-semantics fuzzer at depth: random circuits checked against Rust,
    # each input decided by exhaustive witness search (no forged witness, exactly
    # one honest one). A new seed every run, so coverage grows run by run; a
    # failure prints it for reproduction (`XARK_FUZZ_SEED=<seed>
    # XARK_FUZZ_CASES=5000`).
    name: semantics fuzz (5,000 programs, rotating seed)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install stable Rust + wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: cargo test (semantics fuzz)
        env:
          XARK_FUZZ_CASES: "5000"
          XARK_FUZZ_SEED: ${{ github.run_id }}
        run: cargo test --release -p xark --test semantics_fuzz -- --nocapture

  ed25519-sweep:
    # The adversarial sweep (`cargo xtask difftest`) of ed25519 alone, which pull
    # requests skip (slow.yml): a whole-circuit search takes minutes on a runner, so
    # each gets 10 (`XARK_SEARCH_SECS`). Peaks near 7 GB.
    name: adversarial sweep of ed25519
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install stable Rust + wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Sweep ed25519
        env:
          XARK_SEARCH_SECS: "600"
        run: cargo xtask difftest ed25519 --jobs 1

  toolchain-drift:
    # Early warning for a Rust release that would change a circuit (and so break
    # every key made for it): rebuild every example with this week's stable and
    # beta and compare with tests/stable-digests.txt. `ci.yml` runs the same check
    # on 1.89/stable/beta, but only when something is pushed; this catches a new
    # beta about six weeks before it becomes stable, even when nothing is. See
    # "Toolchain policy" in docs/toolchain.md.
    name: circuit digests on ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install workspace toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install toolchain under test
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --target wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Compare circuit digests
        run: cargo xtask digests --check --toolchain ${{ matrix.toolchain }}

  coverage-whole:
    # The coverage check over every example at once: an allowlist entry no call
    # matches any more, or a committed constant-plug obligation no example uses.
    # Pull requests check every call in four shards (lean.yml), which can't see
    # these; `cargo xtask ci` runs this too.
    name: coverage allowlist and obligations are current
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install rustc 1.99.1 + wasm32
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          shared-key: xtask
          cache-workspace-crates: true
      - name: Every example
        run: cargo xtask lean-export --coverage
        env:
          XARK_JOBS: 1

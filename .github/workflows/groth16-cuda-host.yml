name: Groth16 CUDA adapter host checks

on:
  push:
    branches: [rowfile-window-bounds]
    paths:
      - .github/workflows/groth16-cuda-host.yml
      - crates/groth16-cuda/**
      - crates/groth16-gpu-cli/**
      - crates/groth16/**
      - crates/cli/**
      - crates/ir/**
      - crates/prover/**
      - crates/backend/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - rust-toolchain
      - rust-toolchain.toml

jobs:
  host-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/groth16-cuda -> target

      - name: Rebuild ICICLE native frontend
        run: cargo clean --manifest-path crates/groth16-cuda/Cargo.toml

      - name: Check adapter formatting
        run: cargo fmt --manifest-path crates/groth16-cuda/Cargo.toml -- --check

      - name: Run adapter unit tests
        run: cargo test --manifest-path crates/groth16-cuda/Cargo.toml --lib

      - name: Test benchmark statistics
        run: cargo test --manifest-path crates/groth16-cuda/Cargo.toml --example msm_bench

      - name: Compile adapter tests
        run: cargo test --manifest-path crates/groth16-cuda/Cargo.toml --no-run

      - name: Compile CUDA CLI adapter
        run: cargo check --manifest-path crates/groth16-gpu-cli/Cargo.toml --features cuda-msm

      - name: Test GPU CLI backend selection
        run: cargo test --manifest-path crates/groth16-gpu-cli/Cargo.toml --features cuda-msm --bin xark-gpu

      - name: Check host-side CUDA references
        run: make -C crates/groth16/cuda test-host

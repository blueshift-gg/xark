name: Nightly KATs (known-answer vectors)

# The compiler snapshot suite and the ed25519 gadget carry heavy correctness
# tests that check real hash / curve output against published test vectors:
#   * `crates/lang/tests/snapshot.rs` `#[ignore]`d KATs — SHA-256("abc"),
#     keccak256("") and the 2-block keccak256(bytes(0..200)) vector, the
#     variable-length sha256/blake2s/blake3 vectors, the secp256k1/r1 2G·3G
#     incomplete-EC vectors, and the Keccak/AES Lean-model gate-count bridges;
#   * `gadgets/xark-ed25519/tests/vec.rs` — scalar-mul cross-checks + EdDSA
#     verify/tamper, which each solve a full non-native EC hint program.
# They take minutes (some circuits are >150k constraints), so they run on a
# schedule and on demand rather than on every push. The fast snapshot suite
# (byte-exact gate counts, no KAT solving) runs per-push in `ci.yml`.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

jobs:
  compiler-kats:
    name: compiler KAT vectors (nightly, --include-ignored)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned nightly (rustc_private) toolchain
        # See docs/toolchain.md for the pin and the bump procedure.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-03
          components: rustc-dev, llvm-tools-preview

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/lang/target
            crates/rustc/target
          key: kats-${{ hashFiles('Cargo.lock') }}

      - name: cargo test (snapshots + ignored KAT vectors)
        # `--include-ignored` runs the fast snapshot tests AND the heavy
        # known-answer-vector tests in one pass.
        run: cd crates/lang && cargo test --test snapshot -- --include-ignored

  ec-gadget-vectors:
    name: heavy EC gadget vectors (ed25519 + secp256k1/r1, release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned nightly (rustc_private) toolchain
        # The ed25519 vec.rs suite drives the same nightly compiler via the
        # `xark-test-harness` (which builds the gadgets + compiler), so it needs
        # `rustc-dev` too. See docs/toolchain.md.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-03
          components: rustc-dev, llvm-tools-preview

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/lang/target
            crates/rustc/target
          key: ed25519-${{ hashFiles('Cargo.lock') }}

      - name: cargo test (heavy EC gadget vectors, release)
        # Release is mandatory: the non-native EC solves are 10–50× slower in
        # debug (see the release-mode note in the repo). These heavy KATs live
        # here (too slow for the quick `ci.yml` step).
        #
        # No swapfile: these KATs used to peak ~12 GB (OOM-killed on the 7 GB
        # runner) because the harness materialized the flat R1CS to solve/analyze
        # and the constraint-count pins ran a full expand+minimize. They now
        # stream — `check()`/`check_named` solve+analyze straight from `circuit.xbc`
        # (never the flat system), and the count pins are a streamed digest — so
        # the peak is the compiler subprocess (~5 GB), well under the runner.
        run: cargo test -p xark-ed25519 -p xark-secp256k1 -p xark-secp256r1 --release

name: Bitwuzla (SHA-256 + AES-128 equivalence)

# Runs the bit-blasted equivalence proofs in:
#   * `crates/tests/tests/bitwuzla_sha256.rs` — two QF_BV encodings of the
#     FIPS 180-4 §6.2 SHA-256 compression (gadget-structure vs clean spec),
#     asserts they disagree on any of 8 output words. `unsat` from Bitwuzla
#     = bit-equivalence over all 768-bit inputs (16 W + 8 state words).
#   * `crates/tests/tests/bitwuzla_aes128.rs` — two QF_BV encodings of the
#     FIPS 197 AES-128 single-block encrypt (gadget-structure vs clean
#     spec), asserts they disagree on any of 16 output bytes. `unsat` =
#     bit-equivalence over all 256-bit (plaintext + key) inputs.
#
# Bitwuzla is built from source via the project's documented install path.
# The build adds ~2 min to the CI job; the SHA-256 proof takes <1 s and the
# AES-128 proof takes seconds-to-minutes on a modern x86.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  bitwuzla:
    name: prove (SHA-256 + AES-128 equivalence)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bitwuzla-${{ hashFiles('Cargo.lock') }}

      - name: Install Bitwuzla build deps
        # Bitwuzla 0.9.x's symfpu backend depends on mpfr; without
        # libmpfr-dev the `./configure.py` invocation fails at the meson
        # stage with "Dependency 'mpfr' not found".
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake meson ninja-build python3-pip libgmp-dev libmpfr-dev libgtest-dev

      - name: Build & install Bitwuzla
        run: |
          git clone --depth=1 --branch=0.9.1 https://github.com/bitwuzla/bitwuzla /tmp/bitwuzla
          cd /tmp/bitwuzla
          ./configure.py
          cd build && ninja
          sudo ninja install
          bitwuzla --version

      - name: Run SHA-256 equivalence proof
        env:
          BITWUZLA_TIMEOUT_S: "900"
        run: cargo test --release -p xark-tests --test bitwuzla_sha256 -- --nocapture

      - name: Run AES-128 equivalence proof
        env:
          BITWUZLA_TIMEOUT_S: "1800"
        run: cargo test --release -p xark-tests --test bitwuzla_aes128 -- --nocapture

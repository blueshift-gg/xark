name: Slow checks

# The heavy checks of this repository's own code, too slow for ci.yml's quick
# jobs: known-answer vectors for the hash and curve circuits, the Ed25519 and
# secp256k1/r1 gadget vectors, the adversarial sweep over every example, and the
# crates.io release rehearsal. They run on every pull request, side by side with
# ci.yml, so a break shows on the PR that caused it.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compiler-kats:
    name: compiler KAT vectors (ignored snapshot tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust + wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: kats-${{ hashFiles('Cargo.lock') }}

      - name: cargo test (ignored KAT vectors)
        # Only the `#[ignore]`d known-answer vectors: ci.yml runs the rest of the
        # snapshot suite.
        run: cargo test --release -p xark --test snapshot -- --ignored

  ec-gadget-vectors:
    name: heavy EC gadget vectors (${{ matrix.gadget }}, release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gadget: [xark-ed25519, xark-secp256k1, xark-secp256r1]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust + wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ed25519-${{ hashFiles('Cargo.lock') }}

      - name: cargo test (heavy EC gadget vectors, release)
        # Release is mandatory: the non-native EC solves are 10–50× slower in
        # debug (see the release-mode note in the repo). These heavy KATs live
        # here (too slow for the quick `ci.yml` step).
        #
        # No swapfile: these KATs used to peak ~12 GB (OOM-killed on the 7 GB
        # runner) because the harness materialized the flat R1CS to solve/analyze
        # and the constraint-count pins ran a full expand+minimize. They now
        # stream — `check()`/`check_named` solve+analyze straight from `circuit.xbc`
        # (never the flat system), and the count pins are a streamed digest — so
        # the peak is the compiler subprocess (~5 GB), well under the runner.
        run: cargo test -p ${{ matrix.gadget }} --release

  example-sweep:
    # Every example on its own test inputs, plus single-leaf mutations of them,
    # each decided by exhaustive witness search: exactly one witness where the
    # test accepts, none where it rejects (`cargo xtask difftest`). Split
    # into six shards that run side by side (the examples whose searches run out
    # their budget dealt out first, one per shard); a failure names the example and
    # the input. A whole-ed25519 search peaks near 7 GB.
    name: adversarial example sweep (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install stable Rust + wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          shared-key: xtask
          cache-workspace-crates: true
      - name: Sweep this shard's examples
        # ed25519 is left out here: on these runners every one of its searches ran
        # out of time (undecided) and held a worker for ~20 min. The weekly run
        # (scheduled.yml) sweeps it alone, with time to decide.
        run: cargo xtask difftest --shard ${{ matrix.shard }}/6 --jobs 2 --skip ed25519

  host-examples:
    # The two examples that aren't circuits, so the sweep skips them: the Nova
    # folding prover (with its own tests) and the Grumpkin reference tools that
    # generate the grumpkin examples' test vectors. Each is its own workspace.
    name: host-side example crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install stable Rust + wasm32
        # wasm32: the Nova prover's tests build the circuits they fold.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: |
            examples/grumpkin_nova_prover
            examples/grumpkin_reference
      - name: grumpkin_nova_prover tests
        run: cd examples/grumpkin_nova_prover && cargo test --release
      - name: grumpkin_reference builds
        run: cd examples/grumpkin_reference && cargo build --release

  gnark-bench:
    # The benchmark against gnark (`benches/gnark/`) is outside the workspace, so
    # this is where its circuits are tested and its script is run, one proof a
    # measurement: the numbers are not looked at, only that every line of the
    # table still comes out. It is also the one place another prover takes what
    # `xark export --format iden3` writes: gnark sets up from the rows, proves from
    # the witness and verifies the proof, for six circuits. It needs Go and the
    # network for gnark's modules, which keeps it out of ci.yml.
    name: iden3 export proved by gnark (the benchmark)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install stable Rust + wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: benches/gnark/go/go.sum
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: go vet (the benchmark's gnark programs)
        run: cd benches/gnark/go && go vet ./...
      - name: xark test (the benchmark's circuits)
        run: |
          cargo build --release -p xark-cli
          for c in poseidon2_chain sha256_1024 keccak256_1024; do
            target/release/xark test "benches/gnark/$c"
          done
      - name: benches/gnark/run.sh (one proof a measurement)
        run: benches/gnark/run.sh 1

  publish-dry:
    # A crates.io release rehearsal: every publishable crate is packaged and built
    # from its own `.crate`, as crates.io will see it (`cargo xtask publish --dry-run`).
    # Catches a packaging break (a file left out, missing metadata, a path-only
    # dependency) before release day rather than halfway through a publish.
    name: publish dry run (crates.io)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Package and build every crate
        run: cargo xtask publish --dry-run

name: Lean (gadget soundness)

# Builds the Lean 4 / mathlib proofs in `formal/`.
# `lake build` type-checks every theorem; `formal/AxiomCheck.lean` then fails the job if a harness under
# `formal/templates/` lacks its soundness theorem or constant-plug obligations, or if
# any declaration in `Formal` depends on an axiom beyond `propext`, `Classical.choice`
# and `Quot.sound` (a `sorry` is `sorryAx`, a declared `axiom`, `native_decide`, …), and
# `formal/CircuitHash.lean` fails it unless each exported circuit's Lean composition
# (`Formal/Circuits/`) has the rows the compiler emitted.
# `templates` re-exports every proven gadget's R1CS (`cargo xtask lean-export --check`)
# and fails if the code no longer emits what the proofs were checked against, then
# checks every example's calls of those gadgets emit that R1CS (`--coverage`).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  templates:
    name: proven templates match the code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install rustc 1.99.1 + wasm32
        # The keyed rows coverage compares with are pinned under this rustc
        # (ci.yml's keyed-rows job).
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Re-export every proven gadget
        run: cargo xtask lean-export --check
      - name: Every production call of a proven gadget emits its template
        # Builds every example with the gadget markers; a call whose rows aren't the
        # proven template (alone or with constant plugs) fails unless
        # formal/coverage-allowlist.txt gives a reason. One example at a time: the
        # runner's memory holds one recorded build of the largest example.
        run: cargo xtask lean-export --coverage
        env:
          XARK_JOBS: 1

  lean:
    name: prove (gadget soundness)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: formal
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Build proofs
        run: lake build
      - name: Every harness proven; standard axioms only
        run: lake env lean AxiomCheck.lean
      - name: Each exported circuit's Lean rows hash to the compiler's
        # `Formal/Circuits/<Example>.lean` composes an example from its gadget templates;
        # its rows must hash to the hash `lean-export --example` took of the compiler's.
        run: lake env lean CircuitHash.lean
      - name: Install rustc 1.99.1 + wasm32
        # The pinned rustc of ci.yml's keyed-rows job and the coverage job above.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: A mutated circuit is refused
        working-directory: .
        run: cargo test -p xtask --release lean::tests -- --ignored

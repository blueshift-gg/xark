name: Groth16 OpenCL host checks

on:
  push:
    branches: [rowfile-window-bounds]
    paths:
      - .github/workflows/groth16-opencl-host.yml
      - crates/groth16-opencl/**
      - crates/groth16-gpu-cli/**
      - crates/groth16/opencl/**
      - crates/groth16/**
      - crates/cli/**
      - crates/ir/**
      - crates/prover/**
      - crates/backend/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - rust-toolchain
      - rust-toolchain.toml

jobs:
  pocl-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install OpenCL CPU runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang ocl-icd-libopencl1 pocl-opencl-icd

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/groth16-opencl -> target

      - name: Check formatting
        run: cargo fmt --manifest-path crates/groth16-opencl/Cargo.toml -- --check

      - name: Compile OpenCL 1.2 kernels
        run: make -C crates/groth16/opencl test

      - name: Compile OpenCL MSM benchmark
        run: cargo check --manifest-path crates/groth16-opencl/Cargo.toml --example msm_bench

      - name: Run MSM and proof comparisons on POCL
        env:
          XARK_OPENCL_REQUIRED: "1"
        run: cargo test --manifest-path crates/groth16-opencl/Cargo.toml -- --test-threads=1

      - name: Test GPU CLI backend selection
        run: cargo test --manifest-path crates/groth16-gpu-cli/Cargo.toml --features opencl-msm --bin xark-gpu

      - name: Prove through the GPU CLI on POCL
        run: |
          cargo run -p xark-cli -- setup examples/cube --insecure-dev-mode
          prove_output=$(cargo run --manifest-path crates/groth16-gpu-cli/Cargo.toml --features opencl-msm -- prove examples/cube --inputs '{"secret":"3","result":"27"}' --accelerator opencl --opencl-device any --acknowledge-gpu-side-channel-risk 2>&1)
          printf '%s\n' "$prove_output"
          printf '%s\n' "$prove_output" | grep -E 'MSM backend: Opencl; status=.*; GPU G1 chunks=[1-9][0-9]* points='
          cargo run -p xark-cli -- verify examples/cube

[package]
name = "blake3_test"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/xark", default-features = false }
xark-blake3 = { path = "../../crates/xark-blake3" }

[dev-dependencies]
blake3 = "1"

[target.'cfg(not(xark))'.dependencies]
# Host-only prover so downstream crates (and this crate's tests) can call
# the generated native validator; gated on `cfg(not(xark))` so a circuit
# build stays lean `no_std` with no feature flag.
xark-prover = { path = "../../crates/xark-prover" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

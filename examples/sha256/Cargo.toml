[package]
name = "sha256"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.2.1", default-features = false }
xark-sha256 = { path = "../../gadgets/xark-sha256", version = "0.2.1" }

[dev-dependencies]
sha2 = "0.10"

[target.'cfg(not(xark))'.dependencies]
# Host-only prover so the generated native validator (and this crate's tests)
# can run; gated on `cfg(not(xark))` so a circuit build stays lean `no_std`.
xark-prover = { path = "../../crates/prover", version = "0.2.1" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

[workspace]

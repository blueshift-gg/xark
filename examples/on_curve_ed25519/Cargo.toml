[package]
name = "on_curve_ed25519"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.0.1", default-features = false }
xark-ed25519 = { path = "../../gadgets/xark-ed25519", version = "0.0.1" }

[dev-dependencies]
xark-ed25519 = { path = "../../gadgets/xark-ed25519", version = "0.0.1" }

[target.'cfg(not(xark))'.dependencies]
# Host-only prover so downstream crates (and this crate's tests) can call
# the generated native validator; gated on `cfg(not(xark))` so a circuit
# build stays lean `no_std` with no feature flag.
xark-prover = { path = "../../crates/prover", version = "0.0.1" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

[workspace]

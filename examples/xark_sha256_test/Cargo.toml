[package]
name = "xark_sha256_test"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/xark", default-features = false }
xark-sha256 = { path = "../../crates/xark-sha256" }
# `host` pulls in the prover so downstream crates can call `xark_sha256_test(..)`
# to check inputs; left off, the crate stays `no_std` for the xark compiler.
xark-prover = { path = "../../crates/xark-prover", optional = true }

[dev-dependencies]
xark-prover = { path = "../../crates/xark-prover" }
sha2 = "0.10"

[features]
host = ["dep:xark-prover"]

[workspace]

[package]
name = "aes256_gcm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/xark", default-features = false }
xark-aes = { path = "../../crates/xark-aes" }

[dev-dependencies]
# Reference AES-GCM (renamed to avoid colliding with this crate's own name).
aesgcm-ref = { package = "aes-gcm", version = "0.10" }

[target.'cfg(not(xark))'.dependencies]
xark-prover = { path = "../../crates/xark-prover" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

[workspace]

[package]
name = "secp256r1_ecdsa"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.3.0" }
# lean (no host) for the xark compiler's circuit extraction.
xark-secp256r1 = { path = "../../gadgets/xark-secp256r1", version = "0.3.0" }

[dev-dependencies]
xark-secp256r1 = { path = "../../gadgets/xark-secp256r1", version = "0.3.0" }
p256 = "0.13"
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

[workspace]

[package]
name = "ecdsa_verify"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/xark", default-features = false }
xark-secp256k1 = { path = "../../crates/xark-secp256k1" }
xark-prover = { path = "../../crates/xark-prover", optional = true }

[dev-dependencies]
xark-secp256k1 = { path = "../../crates/xark-secp256k1", features = ["host"] }
xark-prover = { path = "../../crates/xark-prover" }
k256 = "0.13"
sha2 = "0.10"

[features]
host = ["dep:xark-prover", "xark-secp256k1/host"]

[workspace]

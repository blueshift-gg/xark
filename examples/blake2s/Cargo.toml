[package]
name = "blake2s"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", default-features = false }
xark-blake2s = { path = "../../gadgets/xark-blake2s" }

[dev-dependencies]
blake2 = "0.10"

[target.'cfg(not(xark))'.dependencies]
xark-prover = { path = "../../crates/prover" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

[workspace]

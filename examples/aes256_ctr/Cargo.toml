[package]
name = "aes256_ctr"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.2.0", default-features = false }
xark-aes = { path = "../../gadgets/xark-aes", version = "0.2.0" }

[dev-dependencies]
aes-ref = { package = "aes", version = "0.8" }

[target.'cfg(not(xark))'.dependencies]
xark-prover = { path = "../../crates/prover", version = "0.2.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

[workspace]

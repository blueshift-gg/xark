[package]
name = "aes_ctr"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.3.0" }
xark-aes = { path = "../../gadgets/xark-aes", version = "0.3.0" }

[dev-dependencies]
# Reference AES (renamed to avoid colliding with a crate named `aes`).
aes-ref = { package = "aes", version = "0.8" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

[workspace]

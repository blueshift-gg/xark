[package]
name = "word_ops"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/xark", default-features = false }
xark-bits = { path = "../../crates/xark-bits" }

# Host-only prover so this crate's tests can call the generated native validator;
# gated on `cfg(not(xark))` so a circuit build stays lean `no_std`.
[target.'cfg(not(xark))'.dependencies]
xark-prover = { path = "../../crates/xark-prover" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

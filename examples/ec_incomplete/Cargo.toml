[package]
name = "ec_incomplete"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.2.0", default-features = false }
xark-secp256k1 = { path = "../../gadgets/xark-secp256k1", version = "0.2.0" }

[dev-dependencies]
xark-secp256k1 = { path = "../../gadgets/xark-secp256k1", version = "0.2.0" }
k256 = "0.13"

[target.'cfg(not(xark))'.dependencies]
# Host-only prover so downstream crates (and this crate's tests) can call
# the generated native validator; gated on `cfg(not(xark))` so a circuit
# build stays lean `no_std` with no feature flag.
xark-prover = { path = "../../crates/prover", version = "0.2.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

[workspace]

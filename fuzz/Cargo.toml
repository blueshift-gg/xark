[package]
name = "xark-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
xark-acir-r1cs = { path = "../crates/acir-r1cs" }

# Tell `cargo fuzz` to skip workspace inheritance: the fuzz directory is
# intentionally outside the workspace (otherwise `--workspace` builds would
# pull in `libfuzzer-sys`'s `cargo-fuzz` instrumentation flags into every
# non-fuzz crate).
[workspace]

[[bin]]
name = "artifact_parser"
path = "fuzz_targets/artifact_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "witness_parser"
path = "fuzz_targets/witness_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lowering"
path = "fuzz_targets/lowering.rs"
test = false
doc = false
bench = false

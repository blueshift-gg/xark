# The `mul_cert_k1` harness: `a`, `b`, `t` fresh variables. Production passes linear
# combinations; their limb bounds are the callers (formal/coverage-allowlist.txt).
[package]
name = "mul-cert-k1-template"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../../crates/lang", version = "0.3.1" }
xark-bignum = { path = "../../../gadgets/xark-bignum", version = "0.3.1" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

# The `require_lt::<3, 86>` harness, `x` and `m − 1` fresh variables; production's constant
# `m − 1` calls are this template with constant plugs (`lean-export --coverage`).
[package]
name = "require-lt-3x86-template"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../../crates/lang", version = "0.4.0" }
xark-bignum = { path = "../../../gadgets/xark-bignum", version = "0.4.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

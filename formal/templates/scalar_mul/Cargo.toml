# The `scalar_mul` template's harness: one call on fresh inputs, which
# `cargo xtask lean-export scalar_mul` records and writes to formal/Formal/Templates/.
[package]
name = "scalar-mul-template"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../../crates/lang", version = "0.3.1" }
xark-grumpkin = { path = "../../../gadgets/xark-grumpkin", version = "0.3.1" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

# The `pedersen_hash` template's harness: one call on fresh inputs, which
# `cargo xtask lean-export pedersen_hash` records and writes to formal/Formal/Templates/.
[package]
name = "pedersen_hash-template"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../../crates/lang", version = "0.4.0" }
xark-pedersen = { path = "../../../gadgets/xark-pedersen", version = "0.4.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

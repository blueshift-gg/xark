# The `reduce__36` template's harness: one call on fresh inputs, which
# `cargo xtask lean-export reduce__36` records and writes to formal/Formal/Templates/.
[package]
name = "reduce-36-template"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../../crates/lang", version = "0.3.0" }
xark-bits = { path = "../../../gadgets/xark-bits", version = "0.3.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

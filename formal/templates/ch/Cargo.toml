# The `ch` template's harness: one call on fresh inputs, which
# `cargo xtask lean-export ch` records and writes to formal/Formal/Templates/.
[package]
name = "ch-template"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../../crates/lang", version = "0.4.0" }
xark-bits = { path = "../../../gadgets/xark-bits", version = "0.4.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

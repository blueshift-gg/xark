# The `unpack` harness: every input a fresh variable.
[package]
name = "unpack-template"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../../crates/lang", version = "0.3.1" }
xark-secp256k1 = { path = "../../../gadgets/xark-secp256k1", version = "0.3.1" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

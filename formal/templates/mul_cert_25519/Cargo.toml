# The `mul_cert_25519` harness: one call on fresh inputs, which
# `cargo xtask lean-export mul_cert_25519` records and writes to formal/Formal/Templates/.
[package]
name = "mul-cert-25519-template"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../../crates/lang", version = "0.3.1" }
xark-ed25519 = { path = "../../../gadgets/xark-ed25519", version = "0.3.1" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

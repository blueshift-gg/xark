# The `sbox` harness: every input a fresh variable. Production passes proven bits
# (`to_bits` and `xor` outputs), which coverage discharges.
[package]
name = "sbox-template"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../../crates/lang", version = "0.3.0" }
xark-aes = { path = "../../../gadgets/xark-aes", version = "0.3.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

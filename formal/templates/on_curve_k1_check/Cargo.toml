# The `on_curve_k1_check` harness: every input a fresh variable. Production passes a point
# whose limbs its caller range-checks (formal/coverage-allowlist.txt).
[package]
name = "on-curve-k1-check-template"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../../crates/lang", version = "0.3.0" }
xark-bignum = { path = "../../../gadgets/xark-bignum", version = "0.3.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

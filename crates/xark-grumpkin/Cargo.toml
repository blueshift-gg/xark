[package]
name = "xark-grumpkin"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
name = "xark_grumpkin"
path = "src/lib.rs"

[dependencies]
xark = { path = "../xark", default-features = false }
# `host` enables the `NativeInput` impl (native field strings → circuit inputs)
# for `Affine`; off, the crate stays lean `no_std` for the compiler.
xark-prover = { path = "../xark-prover", optional = true }

[features]
host = ["dep:xark-prover"]

[dev-dependencies]
xark-test-harness = { path = "../xark-test-harness" }
xark-ir = { path = "../xark-ir" }

[package]
name = "xark-grumpkin"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
name = "xark_grumpkin"
path = "src/lib.rs"

[dependencies]
xark = { path = "../xark", default-features = false }

# Host-only dep for the `NativeInput` impl (native field strings → circuit
# inputs) for `Affine`. Gated on `cfg(not(xark))`: a circuit build drops it and
# stays lean `no_std`; a host build pulls it in with no feature flag.
[target.'cfg(not(xark))'.dependencies]
xark-prover = { path = "../xark-prover" }

[dev-dependencies]
xark-test-harness = { path = "../xark-test-harness" }
xark-ir = { path = "../xark-ir" }

[lints]
workspace = true

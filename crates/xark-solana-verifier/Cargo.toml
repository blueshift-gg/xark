[package]
name = "xark-solana-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Solana on-chain Groth16 BN254 verifier consuming xark-exported VK + proof bytes."

[lib]
crate-type = ["lib"]

[dependencies]
# Pinocchio is a zero-overhead alternative to `solana-program::entrypoint!`
# and supplies the lightweight `AccountInfo` / `Pubkey` / `ProgramResult`
# types we use in the macro-generated verifier program. Tracks the
# solana-{2,3} crate line; we pin a 0.11 release that matches the broken-
# out `solana-bn254 3.x` series below.
pinocchio = "0.11"
# The `alt_bn128` syscall wrappers — kept as a direct dep instead of
# pulling all of `solana-program` for three syscalls.
solana-bn254 = "3"
# `solana-address::Address` is the new canonical 32-byte account-key
# type. `solana-pubkey` is now just a re-export shim (`Address as
# Pubkey`), so we use `solana-address` directly everywhere.
solana-address = { version = "2", default-features = false }
solana-account-info = { version = "3", default-features = false }
solana-program-error = { version = "3", default-features = false }
solana-program-entrypoint = "3"
thiserror = { workspace = true }

[dependencies.ark-bn254]
workspace = true
optional = true

[dependencies.ark-ec]
workspace = true
optional = true

[dependencies.ark-ff]
workspace = true
optional = true

[dependencies.num-bigint]
workspace = true
optional = true

[dev-dependencies]
ark-bn254 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-groth16 = { workspace = true }
ark-serialize = { workspace = true }
num-bigint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Lets the macros test re-encode the canonical Arkworks VK into LE wire
# format and cross-check against the committed
# `verifying_key.solana.bin` fixture.
groth16-backend = { path = "../groth16-backend" }

# Mollusk e2e harness — loads the SBF-built sample program
# (`crates/xark-arithmetic-square-program`) into a lightweight SVM and
# runs the LE pairing path against real `alt_bn128_*_le` syscalls.
# Requires `cargo build-sbf -p xark-arithmetic-square-program` to have
# produced `target/deploy/xark_arithmetic_square_program.so`; the test
# skips with a clear `eprintln!` when the artifact is missing so plain
# `cargo test -p xark-solana-verifier` (without the SBF toolchain) still
# works.
mollusk-svm = "0.13"
solana-instruction = "3"
solana-address = "2"

[features]
no-entrypoint = []
# Exposes an Arkworks-native [`Bn128Backend`] implementation
# (`ark_backend::ArkBackend`) for off-chain testing. Pulls in extra ark
# dependencies, so it is opt-in.
ark-backend = ["dep:ark-bn254", "dep:ark-ec", "dep:ark-ff", "dep:num-bigint"]

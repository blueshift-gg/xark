[package]
name = "xark-wasm"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "WebAssembly bindings for generating xark Groth16 (BN254) proofs in the browser / Node."
repository = "https://github.com/blueshift-gg/xark"
publish = false

[lib]
name = "xark_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
xark-ir = { path = "../ir" }
# disable threading support
xark-prover = { path = "../prover", default-features = false }

ark-bn254 = { version = "0.6", default-features = false, features = ["curve"] }
ark-ff = { version = "0.6", default-features = false, features = ["std"] }
ark-ec = { version = "0.6", default-features = false, features = ["std"] }
ark-groth16 = { version = "0.6", default-features = false, features = ["std"] }
ark-relations = { version = "0.6", default-features = false, features = ["std"] }
ark-serialize = { version = "0.6", default-features = false, features = ["std"] }
ark-snark = { version = "0.6", default-features = false }
ark-std = { version = "0.6", default-features = false, features = ["std"] }

num-bigint = "0.4"
serde_json = "1"

# wasm glue. `getrandom`'s `js` feature makes `OsRng` work in the browser/Node
# (it backs onto `crypto.getRandomValues` / `require('crypto')`).
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

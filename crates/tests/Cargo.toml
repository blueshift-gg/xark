# The workspace's whole integration-test + benchmark suite, in one place.
# Not published. Holds every crate's integration tests, all benches, the
# committed circuit fixtures, and the `xark` binary locator for the CLI tests.
#
#   cargo test  -p xark-tests   # all integration tests (host + on-chain)
#   cargo bench -p xark-tests   # all benches
#
# Heavy deps (backend, arkworks, …) are DEV-dependencies on purpose: the
# `#[svm_test]` cdylibs that `svm-unit-test` generates depend on this crate's
# lib, which must stay no_std / SBF-buildable. Only `xark-verifier` (no_std) is
# a normal dependency; the lib re-exports it and embeds the fixtures.
[package]
name = "xark-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
xark-verifier = { path = "../verifier" }

[dev-dependencies]
xark-backend = { path = "../backend", features = ["test-deterministic"] }
xark-acir-r1cs = { path = "../acir-r1cs" }
ark-bn254.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
ark-groth16.workspace = true
ark-relations.workspace = true
ark-serialize.workspace = true
ark-snark.workspace = true
ark-std.workspace = true
rand.workspace = true
rand_chacha.workspace = true
sha2.workspace = true
hex.workspace = true
serde_json.workspace = true
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
svm-unit-test = "0.1.8"
proptest = "1"

[[bench]]
name = "groth16"
harness = false

[lints]
workspace = true

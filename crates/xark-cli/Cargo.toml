[package]
name = "xark-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line interface for the xark Noir/Groth16 backend."

[[bin]]
name = "xark"
path = "src/main.rs"

[dependencies]
acir-r1cs = { path = "../acir-r1cs" }
groth16-backend = { path = "../groth16-backend", features = ["test-deterministic"] }
# `no-entrypoint` keeps the Solana program entry-point macro out of this host
# binary; we only need the wire-format constants and the (host-callable)
# `verify_groth16_with` core.
xark-solana-verifier = { path = "../xark-solana-verifier", features = ["no-entrypoint"] }

ark-bn254.workspace = true
ark-ff.workspace = true
ark-relations.workspace = true
ark-serialize.workspace = true
ark-snark.workspace = true

anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex.workspace = true
rand.workspace = true
rand_chacha.workspace = true
chrono.workspace = true

[dev-dependencies]
# `ark-backend` exposes an Arkworks-native [`Bn128Backend`] so the Solana
# export integration test can round-trip the wire bytes through the verifier
# without standing up a Solana cluster.
xark-solana-verifier = { path = "../xark-solana-verifier", features = ["no-entrypoint", "ark-backend"] }

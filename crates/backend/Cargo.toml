[package]
name = "xark-backend"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Groth16 (BN254) keys, trusted-setup ceremony, serialization and verification for xark circuits."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"
exclude = ["tests", "benches", "examples"]

[dependencies]
ark-bn254.workspace = true
ark-ff.workspace = true
ark-ec.workspace = true
ark-serialize.workspace = true
ark-std.workspace = true
xark-groth16 = { path = "../groth16", version = "0.3.0" }


thiserror.workspace = true
serde.workspace = true
hex.workspace = true
rand.workspace = true
rand_chacha.workspace = true
num-bigint.workspace = true
chrono.workspace = true
sha2.workspace = true
rayon = "1"

[dev-dependencies]
xark-ir = { path = "../ir" }

[features]
default = []
test-deterministic = []

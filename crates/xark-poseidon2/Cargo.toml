[package]
name = "xark-poseidon2"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
name = "xark_poseidon2"
path = "src/lib.rs"

[features]
# Run this gadget as ordinary Rust on the host (a wallet computing the same
# Poseidon2 the circuit does). Forwards to `xark/native`. Circuit compilation
# needs neither.
native = ["xark/native"]

[dependencies]
xark = { path = "../xark", default-features = false }

[dev-dependencies]
xark-test-harness = { path = "../xark-test-harness" }
xark-ir = { path = "../xark-ir" }


[package]
name = "xark-groth16-opencl"
description = "OpenCL device for xark's Groth16 prover: the G1 MSM and the quotient's transforms on a GPU, beside the CPU (`xark prove --prover opencl`)."
keywords = ["zero-knowledge", "zk", "groth16", "gpu", "opencl"]
categories = ["cryptography"]
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
xark-groth16 = { path = "../groth16", version = "0.5.0" }
ark-bn254 = { version = "0.6", default-features = false, features = ["curve"] }
ark-ec = { version = "0.6", default-features = false, features = ["std"] }
ark-ff = { version = "0.6", default-features = false, features = ["std"] }
ark-serialize = { version = "0.6", default-features = false, features = ["std"] }
rayon = "1"
# Its default `dynamic` feature loads the OpenCL library at run time, so the
# crate builds (and its tests skip) where no OpenCL is installed.
opencl3 = { version = "0.12.3", features = ["CL_VERSION_1_1", "CL_VERSION_1_2"] }

[dev-dependencies]
rand = "0.8"
rand_chacha = { version = "0.3", default-features = false }
xark-ir = { path = "../ir", version = "0.5.0" }

[lints]
workspace = true

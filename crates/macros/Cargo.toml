[package]
name = "xark-macros"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Proc macros for xark circuits (the `#[circuit]` attribute)."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

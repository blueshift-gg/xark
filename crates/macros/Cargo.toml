[package]
name = "xark-macros"
version = "0.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/blueshift-gg/xark"
description = "Proc macros for xark circuits (the `#[circuit]` attribute)."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

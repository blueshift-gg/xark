name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The xark this project is made with (its `xark.toml`).
  XARK_CLI_VERSION: {{xark_version}}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: The wasm32 target circuits build for
        run: rustup target add wasm32-unknown-unknown

      # xark builds from source, once, then comes from this cache.
      - name: Cached xark
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/xark
          key: xark-${{ runner.os }}-${{ env.XARK_CLI_VERSION }}

      - name: Install xark
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install xark-cli --version "$XARK_CLI_VERSION" --locked

      # The committed keys and generated clients are what this source builds.
      - name: xark build --check
        run: xark build --check

      - name: xark test
        run: xark test

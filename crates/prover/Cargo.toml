[package]
name = "xark-prover"
description = "xark's Groth16 (BN254) prover: witness solving, trusted setup, prove, and verify."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["parallel"]

# Opt-in developer diagnostics — forwards to `xark-ir`'s `debug` feature.
debug = ["xark-ir/debug"]

parallel = [
    "xark-ir/parallel",
    "ark-ff/parallel",
    "ark-ec/parallel",
    "ark-groth16/parallel",
    "ark-relations/parallel",
    "ark-std/parallel",
]

# Deps are set to parallel via features, but defaults to non-parallel so WASM
# build would work
[dependencies]
xark-ir = { path = "../ir", version = "0.2.1", default-features = false  }
ark-bn254 = { workspace = true }
ark-ff = { version = "0.6", default-features = false, features = ["std"] }
ark-ec = { version = "0.6", default-features = false, features = ["std"] }
ark-groth16 = { version = "0.6", default-features = false, features = ["std"] }
ark-relations = { version = "0.6", default-features = false, features = ["std"] }
ark-snark = { workspace = true }
ark-std = { version = "0.6", default-features = false, features = ["std"] }
num-bigint = "0.4"
rand = "0.8"

[dev-dependencies]
# A unit test round-trips `FieldConst`'s custom serde impl through JSON.
serde_json = "1"

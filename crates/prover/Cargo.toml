[package]
name = "xark-prover"
description = "xark's Groth16 (BN254) prover: witness solving, trusted setup, prove, and verify."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["parallel"]

# Opt-in developer diagnostics — forwards to `xark-ir`'s `debug` feature.
debug = ["xark-ir/debug"]

parallel = [
    "xark-ir/parallel",
    "ark-ff/parallel",
]

# Deps are set to parallel via features, but defaults to non-parallel so WASM
# build would work
[dependencies]
xark-ir = { path = "../ir", version = "0.3.0", default-features = false  }
ark-bn254 = { workspace = true }
ark-ff = { version = "0.6", default-features = false, features = ["std"] }
ark-serialize = { version = "0.6", default-features = false }
num-bigint = "0.4"
serde_json = "1"
rand = "0.8"
sha2 = "0.11"
xark-groth16 = { path = "../groth16", version = "0.3.0" }

[dev-dependencies]
# A unit test round-trips `FieldConst`'s custom serde impl through JSON.
serde_json = "1"

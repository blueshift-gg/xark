[package]
name = "xark-prover"
description = "xark's Groth16 (BN254) prover: witness solving, trusted setup, prove, and verify."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["groth16"]
# The language crate only needs the native input/checking runtime. Keep the
# heavyweight proving backend available to the CLI and explicit host users.
groth16 = ["dep:ark-groth16", "dep:ark-relations", "dep:ark-snark", "dep:rand"]
# Opt-in developer diagnostics — forwards to `xark-ir`'s `debug` feature.
debug = ["xark-ir/debug"]

[dependencies]
xark-ir = { path = "../ir", version = "0.2.2" }
# Use the workspace arkworks deps (which enable `parallel`) so the prover fans
# MSM/FFT across cores even when this crate is built in isolation — not only when
# Cargo feature-unification happens to pull `parallel` in via `xark-backend`.
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
ark-groth16 = { workspace = true, optional = true }
ark-relations = { workspace = true, optional = true }
ark-snark = { workspace = true, optional = true }
num-bigint = "0.4"
rand = { version = "0.8", optional = true }

[dev-dependencies]
# A unit test round-trips `FieldConst`'s custom serde impl through JSON.
serde_json = "1"

[package]
name = "xark-frontend"
description = "xark's stable-Rust circuit frontend: lowers a circuit compiled to wasm32 into R1CS."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[dependencies]
xark-ir = { path = "../ir", version = "0.3.0" }
wasmparser = "0.219"
serde_json = "1"
num-bigint = "0.4"
rayon = "1"
addr2line = { version = "0.25", default-features = false, features = ["std", "rustc-demangle"] }
rustc-demangle = "0.1"

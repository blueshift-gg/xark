[package]
name = "xark-secp256r1"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../xark", default-features = false }
xark-bignum = { path = "../xark-bignum" }
xark-curve = { path = "../xark-curve" }
# `host` enables the macro-emitted `NativeInput` impls (native bytes → circuit
# inputs) for `Point`/`Fq`; off, the crate stays lean `no_std` for the compiler.
num-bigint = { version = "0.4", optional = true }
xark-prover = { path = "../xark-prover", optional = true }

[features]
host = ["dep:xark-prover", "dep:num-bigint"]

[dev-dependencies]
num-bigint = "0.4"
p256 = "0.13"
sha2 = "0.10"
xark-ir = { path = "../xark-ir" }
xark-test-harness = { path = "../xark-test-harness" }

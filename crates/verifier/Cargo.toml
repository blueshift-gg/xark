[package]
name = "xark-verifier"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Solana on-chain Groth16 BN254 verifier consuming xark-exported VK + proof bytes."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"

# Lean publishable verifier: source + README only. Fixtures + the
# on-chain/host/fuzz test harness live in the (unpublished) `xark-tests` crate.
exclude = ["tests", "benches"]

[lib]
crate-type = ["lib"]

[features]
# `static-syscalls` emits the SBPFv3 static-syscall ABI for the alt_bn128
# group op (a `callx` to a murmur-hashed immediate). SBPFv3 is the current
# mainnet ABI, so default to it — a v3 program calls the syscall directly,
# without a relocation.
#
# To target a legacy SBPFv0/v2 loader instead, depend on this crate with
# `default-features = false`: that swaps back to dynamic syscall symbols
# (a relocated call to the named symbol), which every loader resolves. Build
# the program itself as v0 too — a v3 `callx` in a v0 container decodes as an
# out-of-bounds relative call and the loader rejects the whole `.so`.
#
# Caveat: a toolchain that both defaults to v3 AND sets `target_feature =
# "static-syscalls"` activates the crate's static path regardless of this
# feature (it gates on `any(target_feature, feature)`), so opting out to v0
# there also needs a v0 build target, not just this switch.
default = ["static-syscalls"]
static-syscalls = ["solana-nostd-alt-bn128/static-syscalls"]

[dependencies]
# `default-features = false` so the SBPFv3 ABI is controlled by *this* crate's
# `static-syscalls` feature above (default on), and `xark-verifier`'s own
# `default-features = false` cleanly opts a dependent down to SBPFv0.
solana-nostd-alt-bn128 = { version = "0.1.1", default-features = false }
solana-program-error = { version = "3", default-features = false }

[lints]
workspace = true

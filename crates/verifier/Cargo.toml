[package]
name = "xark-verifier"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Solana on-chain Groth16 BN254 verifier consuming xark-exported VK + proof bytes."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"

# Lean publishable verifier: source + README only. Fixtures + the
# on-chain/host/fuzz test harness live in the (unpublished) `xark-tests` crate.
exclude = ["tests", "benches"]

[lib]
crate-type = ["lib"]

[features]
# Let the Solana build target select its own syscall ABI. SBPFv0/v2 targets use
# dynamic syscall symbols; SBPFv3 sets the `static-syscalls` target feature and
# emits direct hashed calls. This keeps a plain `cargo build-sbf` internally
# consistent instead of forcing v3 calls into a v0 container.
default = []
# Explicit override for toolchains that target SBPFv3 without advertising the
# corresponding target feature. Normal programs should not need this.
static-syscalls = ["solana-nostd-alt-bn128/static-syscalls"]

[dependencies]
# Keep the dependency's feature surface explicit; the target feature still
# selects the native SBPFv3 path automatically.
solana-nostd-alt-bn128 = { version = "0.1.1", default-features = false }
solana-program-error = { version = "3", default-features = false }

[lints]
workspace = true

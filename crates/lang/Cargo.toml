[package]
name = "xark"
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/blueshift-gg/xark"
description = "Write zero-knowledge circuits in Rust — the language prelude (no_std, stable)."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"

# The language: `use xark::prelude::*;` in a circuit (no_std, stable).
[lib]
name = "xark"
path = "src/lib.rs"

[dependencies]
# The `#[circuit]` / `#[gadget]` attribute macros (always available to authors).
xark-macros = { path = "../macros", version = "0.0.1" }

[dev-dependencies]
xark-test-harness = { path = "../test-harness", version = "0.0.1" }
xark-ir = { path = "../ir", version = "0.0.1" }
xark-prover = { path = "../prover", version = "0.0.1" }
serde_json = "1"

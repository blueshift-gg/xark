[package]
name = "xark"
version = "0.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/blueshift-gg/xark"
description = "Write zero-knowledge circuits in Rust — the language prelude (no_std, stable)."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"

# The language: `use xark::prelude::*;` in a circuit (no_std, stable).
[lib]
name = "xark"
path = "src/lib.rs"

[dependencies]
# The `#[circuit]` / `#[gadget]` attribute macros (always available to authors).
xark-macros = { path = "../macros", version = "0.2.2" }

# Host-only runtime for the native validator generated by `#[circuit]`, plus
# `From<Field> for ark_bn254::Fr`. Keeping it behind the language crate means a
# circuit author depends on `xark` alone; the xark compiler reports `cfg(xark)`,
# so circuit builds still stay lean and never pull the prover or Arkworks.
[target.'cfg(not(xark))'.dependencies]
ark-bn254 = { version = "0.6", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "0.6", default-features = false }
xark-prover = { path = "../prover", version = "0.2.2", default-features = false }

[dev-dependencies]
xark-test-harness = { path = "../test-harness", version = "0.2.2" }
xark-ir = { path = "../ir", version = "0.2.2" }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

[package]
name = "xark"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Write zero-knowledge circuits in Rust — the language prelude (no_std, stable)."

# The language: `use xark::prelude::*;` in a circuit (no_std, stable).
[lib]
name = "xark"
path = "src/lib.rs"

[dependencies]
# The `#[circuit]` / `#[gadget]` attribute macros (always available to authors).
xark-macros = { path = "../xark-macros" }

[dev-dependencies]
xark-test-harness = { path = "../xark-test-harness" }
xark-ir = { path = "../xark-ir" }
xark-prover = { path = "../xark-prover" }
serde_json = "1"

[package]
name = "xark-groth16-cuda"
description = "CUDA device for xark's Groth16 prover: the G1 MSM and the quotient's transforms on an NVIDIA GPU, beside the CPU (`xark prove --prover cuda`)."
keywords = ["zero-knowledge", "zk", "groth16", "gpu", "cuda"]
categories = ["cryptography"]
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
# Compiles the kernels with nvcc and links the CUDA runtime. Without it the
# crate builds anywhere and its device declines every request.
cuda = []

[build-dependencies]
cc = "1"

[dependencies]
xark-groth16 = { path = "../groth16", version = "0.5.0" }
ark-bn254 = { version = "0.6", default-features = false, features = ["curve"] }
ark-ec = { version = "0.6", default-features = false, features = ["std"] }
ark-ff = { version = "0.6", default-features = false, features = ["std"] }
ark-serialize = { version = "0.6", default-features = false, features = ["std"] }
rayon = "1"

[dev-dependencies]
rand = "0.8"
rand_chacha = { version = "0.3", default-features = false }

[lints]
workspace = true

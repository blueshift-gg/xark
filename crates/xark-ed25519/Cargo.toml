[package]
name = "xark-ed25519"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
name = "xark_ed25519"
path = "src/lib.rs"

[dependencies]
xark = { path = "../xark", default-features = false }
xark-bignum = { path = "../xark-bignum" }
xark-curve = { path = "../xark-curve" }

[dev-dependencies]
ed25519-dalek = "2"
num-bigint = "0.4"
sha2 = "0.10"
xark-ir = { path = "../xark-ir" }
xark-test-harness = { path = "../xark-test-harness" }

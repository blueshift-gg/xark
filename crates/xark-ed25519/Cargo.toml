[package]
name = "xark-ed25519"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
name = "xark_ed25519"
path = "src/lib.rs"

[dependencies]
xark = { path = "../xark", default-features = false }
xark-bignum = { path = "../xark-bignum" }
xark-curve = { path = "../xark-curve" }
# `host` enables the `NativeInput` impls (native bytes → circuit inputs): the
# macro-emitted `Point`/`Fq`, plus this crate's lazy `PointL` + full-signature
# EdDSA host helpers (point decompression, SHA-512 challenge).
num-bigint = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
xark-prover = { path = "../xark-prover", optional = true }

[features]
host = ["dep:xark-prover", "dep:num-bigint", "dep:sha2"]

[dev-dependencies]
ed25519-dalek = "2"
num-bigint = "0.4"
sha2 = "0.10"
xark-ir = { path = "../xark-ir" }
xark-test-harness = { path = "../xark-test-harness" }

[package]
name = "xark-acir-r1cs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lowers Noir ACIR artifacts into Arkworks R1CS over BN254."
exclude = ["tests", "benches"]

[dependencies]
ark-bn254.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
ark-relations.workspace = true
ark-std.workspace = true

acir.workspace = true

thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
ark-std = { workspace = true, features = ["std"] }
rand.workspace = true
# Reference Keccak-f[1600] implementation used to cross-check the in-circuit
# gadget's KAT.
keccak = "0.1"
# Reference Blake2s implementation used to cross-check the in-circuit gadget's
# KAT.
blake2 = "0.10"
# Reference Blake3 implementation used to cross-check the in-circuit gadget's
# KAT.
blake3 = "1"
# Reference AES-128 implementations used to cross-check the in-circuit AES
# gadget's KAT.
aes = "0.9"
cbc = "0.2"
# Reference secp256k1 ECDSA implementation used to cross-check the in-circuit
# gadget's KAT.
k256 = { version = "0.14.0-rc.9", features = ["ecdsa"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }

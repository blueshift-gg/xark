[package]
name = "xark-bits"
description = "Bit- and word-level building blocks for xark circuit gadgets."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[lib]
name = "xark_bits"
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.2.1", default-features = false }

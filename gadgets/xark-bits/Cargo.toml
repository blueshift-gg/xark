[package]
name = "xark-bits"
description = "Bit- and word-level building blocks for xark circuit gadgets."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "xark_bits"
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.3.0" }

[dev-dependencies]
xark-test-harness = { path = "../../crates/test-harness", version = "0.3.0" }
xark-ir = { path = "../../crates/ir", version = "0.3.0" }
num-bigint.workspace = true
sha2.workspace = true
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

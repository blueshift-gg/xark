[package]
name = "xark-grumpkin"
description = "Grumpkin curve gadget for xark zero-knowledge circuits."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "xark_grumpkin"
path = "src/lib.rs"

[dependencies]
xark.workspace = true
# `schnorr`'s challenge.
xark-poseidon2.workspace = true

# `schnorr::host`: keys, signing and verification (not in a circuit build).
[target.'cfg(not(xark))'.dependencies]
ark-ec = { version = "0.6", default-features = false }
ark-ff = { version = "0.6", default-features = false }
ark-grumpkin = { version = "0.6", default-features = false }

[dev-dependencies]
num-bigint.workspace = true
xark-test-harness = { path = "../../crates/test-harness" }
xark-ir = { path = "../../crates/ir" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

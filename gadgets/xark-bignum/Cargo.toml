[package]
name = "xark-bignum"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", default-features = false }

# Host-only: the `NativeInput` impl (decimal string → `.limbs[i]` circuit inputs)
# lives in the `std` prover; excluded from the `no_std` circuit build.
[target.'cfg(not(xark))'.dependencies]
xark-prover = { path = "../../crates/prover" }

[dev-dependencies]
xark-test-harness = { path = "../../crates/test-harness" }
xark-ir = { path = "../../crates/ir" }

[package]
name = "xark-bignum"
description = "Non-native (foreign-field) limb arithmetic for xark circuit gadgets."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.2.0", default-features = false }

# Host-only: the `NativeInput` impl (decimal string → `.limbs[i]` circuit inputs)
# lives in the `std` prover; excluded from the `no_std` circuit build.
[target.'cfg(not(xark))'.dependencies]
xark-prover = { path = "../../crates/prover", version = "0.2.0" }

[dev-dependencies]
xark-test-harness = { path = "../../crates/test-harness", version = "0.2.0" }
xark-ir = { path = "../../crates/ir", version = "0.2.0" }

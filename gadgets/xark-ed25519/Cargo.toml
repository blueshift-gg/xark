[package]
name = "xark-ed25519"
description = "Ed25519 scalar multiplication and EdDSA verification gadget for xark circuits."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[lib]
name = "xark_ed25519"
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.2.0", default-features = false }
xark-bignum = { path = "../xark-bignum", version = "0.2.0" }
xark-curve = { path = "../xark-curve", version = "0.2.0" }

# Host-only deps for the `NativeInput` impls (native bytes → circuit inputs): the
# macro-emitted `Point`/`Fq`, plus this crate's lazy `PointL` + full-signature
# EdDSA host helpers (point decompression, SHA-512 challenge). Gated on
# `cfg(not(xark))`: a circuit build drops them and stays lean `no_std`; a host
# build pulls them in with no feature flag.
[target.'cfg(not(xark))'.dependencies]
num-bigint = "0.4"
sha2 = "0.10"
xark-prover = { path = "../../crates/prover", version = "0.2.0" }

[dev-dependencies]
ed25519-dalek = "2"
num-bigint = "0.4"
sha2 = "0.10"
xark-ir = { path = "../../crates/ir", version = "0.2.0" }
xark-test-harness = { path = "../../crates/test-harness", version = "0.2.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

[package]
name = "xark-ed25519"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
name = "xark_ed25519"
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", default-features = false }
xark-bignum = { path = "../xark-bignum" }
xark-curve = { path = "../xark-curve" }

# Host-only deps for the `NativeInput` impls (native bytes → circuit inputs): the
# macro-emitted `Point`/`Fq`, plus this crate's lazy `PointL` + full-signature
# EdDSA host helpers (point decompression, SHA-512 challenge). Gated on
# `cfg(not(xark))`: a circuit build drops them and stays lean `no_std`; a host
# build pulls them in with no feature flag.
[target.'cfg(not(xark))'.dependencies]
num-bigint = "0.4"
sha2 = "0.10"
xark-prover = { path = "../../crates/prover" }

[dev-dependencies]
ed25519-dalek = "2"
num-bigint = "0.4"
sha2 = "0.10"
xark-ir = { path = "../../crates/ir" }
xark-test-harness = { path = "../../crates/test-harness" }

[lints]
workspace = true

[package]
name = "xark-ed25519"
description = "Ed25519 scalar multiplication and EdDSA verification gadget for xark circuits."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[lib]
name = "xark_ed25519"
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.2.2" }
xark-bignum = { path = "../xark-bignum", version = "0.2.2" }
xark-curve = { path = "../xark-curve", version = "0.2.2" }

# Host-only arithmetic and hashing for point decompression and EdDSA helpers.
[target.'cfg(not(xark))'.dependencies]
num-bigint = "0.4"
sha2 = "0.10"

[dev-dependencies]
ed25519-dalek = "2"
num-bigint = "0.4"
sha2 = "0.10"
xark-ir = { path = "../../crates/ir", version = "0.2.2" }
xark-test-harness = { path = "../../crates/test-harness", version = "0.2.2" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

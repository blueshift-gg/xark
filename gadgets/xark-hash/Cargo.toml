[package]
name = "xark-hash"
description = "Shared Hash and Digest types for xark hash gadgets."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[lib]
name = "xark_hash"
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.2.0", default-features = false }

# Host-only: the `Hash` `NativeInput` impl (32-byte hash → `.hi`/`.lo` inputs)
# lives in the `std` prover; excluded from the `no_std` circuit build.
[target.'cfg(not(xark))'.dependencies]
xark-prover = { path = "../../crates/prover", version = "0.2.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

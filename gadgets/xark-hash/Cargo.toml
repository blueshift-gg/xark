[package]
name = "xark-hash"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
name = "xark_hash"
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", default-features = false }

# Host-only: the `Hash` `NativeInput` impl (32-byte hash → `.hi`/`.lo` inputs)
# lives in the `std` prover; excluded from the `no_std` circuit build.
[target.'cfg(not(xark))'.dependencies]
xark-prover = { path = "../../crates/prover" }

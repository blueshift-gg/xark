[package]
name = "xark-secp256r1"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", default-features = false }
xark-bignum = { path = "../xark-bignum" }
xark-curve = { path = "../xark-curve" }

# Host-only deps for the macro-emitted `NativeInput` impls (native bytes →
# circuit inputs). Gated on `cfg(not(xark))`: a circuit build (driver reports the
# `xark` cfg) drops them and stays lean `no_std`; a host build pulls them in with
# no feature flag.
[target.'cfg(not(xark))'.dependencies]
num-bigint = "0.4"
xark-prover = { path = "../../crates/prover" }

[dev-dependencies]
num-bigint = "0.4"
p256 = "0.13"
sha2 = "0.10"
xark-ir = { path = "../../crates/ir" }
xark-test-harness = { path = "../../crates/test-harness" }

[lints]
workspace = true

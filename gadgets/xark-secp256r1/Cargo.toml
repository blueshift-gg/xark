[package]
name = "xark-secp256r1"
description = "secp256r1 (P-256) ECDSA-verification gadget for xark zero-knowledge circuits."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.2.0", default-features = false }
xark-bignum = { path = "../xark-bignum", version = "0.2.0" }
xark-curve = { path = "../xark-curve", version = "0.2.0" }

# Host-only deps for the macro-emitted `NativeInput` impls (native bytes →
# circuit inputs). Gated on `cfg(not(xark))`: a circuit build (driver reports the
# `xark` cfg) drops them and stays lean `no_std`; a host build pulls them in with
# no feature flag.
[target.'cfg(not(xark))'.dependencies]
num-bigint = "0.4"
xark-prover = { path = "../../crates/prover", version = "0.2.0" }

[dev-dependencies]
num-bigint = "0.4"
p256 = "0.13"
sha2 = "0.10"
xark-ir = { path = "../../crates/ir", version = "0.2.0" }
xark-test-harness = { path = "../../crates/test-harness", version = "0.2.0" }

[lints]
workspace = true

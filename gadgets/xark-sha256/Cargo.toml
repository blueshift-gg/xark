[package]
name = "xark-sha256"
description = "SHA-256 gadget for xark zero-knowledge circuits."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "xark_sha256"
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.3.0" }
xark-bits = { path = "../xark-bits", version = "0.3.0" }
xark-hash = { path = "../xark-hash", version = "0.3.0" }

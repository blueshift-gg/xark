[package]
name = "xark-secp256k1"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
name = "xark_secp256k1"
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", default-features = false }
xark-bignum = { path = "../xark-bignum" }
xark-curve = { path = "../xark-curve" }

# Host-only deps for the `NativeInput` impls (native bytes → circuit inputs).
# Gated on `cfg(not(xark))`: the `xark-rustc` driver reports the `xark` cfg, so a
# circuit build drops these and the crate stays lean `no_std`; an ordinary host
# build (tests, downstream provers) pulls them in with no feature flag.
[target.'cfg(not(xark))'.dependencies]
num-bigint = "0.4"
xark-prover = { path = "../../crates/prover" }

[dev-dependencies]
k256 = "0.13"
num-bigint = "0.4"
sha2 = "0.10"
xark-ir = { path = "../../crates/ir" }
xark-test-harness = { path = "../../crates/test-harness" }

[lints]
workspace = true

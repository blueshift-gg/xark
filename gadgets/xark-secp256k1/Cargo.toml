[package]
name = "xark-secp256k1"
description = "secp256k1 ECDSA-verification gadget for xark zero-knowledge circuits."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[lib]
name = "xark_secp256k1"
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.2.2" }
xark-bignum = { path = "../xark-bignum", version = "0.2.2" }
xark-curve = { path = "../xark-curve", version = "0.2.2" }

# Host-only arithmetic used by native input helpers.
[target.'cfg(not(xark))'.dependencies]
num-bigint = "0.4"

[dev-dependencies]
k256 = "0.13"
num-bigint = "0.4"
sha2 = "0.10"
xark-ir = { path = "../../crates/ir", version = "0.2.2" }
xark-test-harness = { path = "../../crates/test-harness", version = "0.2.2" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

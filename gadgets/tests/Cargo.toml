# The workspace's whole integration-test + benchmark suite, in one place.
# Not published. Holds every crate's integration tests, all benches, the
# committed circuit fixtures, and the `xark` binary locator for the CLI tests.
#
#   cargo test  -p xark-tests   # all integration tests (host + on-chain)
#   cargo bench -p xark-tests   # all benches
#
# Heavy deps (backend, arkworks, …) are DEV-dependencies on purpose: the
# `#[svm_test]` cdylibs that `svm-unit-test` generates depend on this crate's
# lib, which must stay no_std / SBF-buildable. Only `xark-verifier` (no_std) is
# a normal dependency; the lib re-exports it and embeds the fixtures.
[package]
name = "xark-tests"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[dependencies]
xark-verifier = { path = "../../crates/verifier", version = "0.2.0" }
# Direct dep so the `#[svm_test]` cdylibs in `tests/differential_alt_bn128.rs`
# can reach the BN254 group-op API. Already pulled in transitively via
# `xark-verifier`; promoting to a top-level dep keeps the import path stable
# and makes the SBF cdylib's resolver pick it up.
solana-nostd-alt-bn128 = "0.1.1"

[dev-dependencies]
xark-backend = { path = "../../crates/backend", version = "0.2.0", features = ["test-deterministic"] }
xark-prover = { path = "../../crates/prover", version = "0.2.0" }
xark-ir = { path = "../../crates/ir", version = "0.2.0" }
ark-bn254.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
ark-groth16.workspace = true
ark-relations.workspace = true
ark-serialize.workspace = true
ark-snark.workspace = true
ark-std.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rayon = "1"
sha2.workspace = true
hex.workspace = true
num-bigint.workspace = true
serde_json.workspace = true
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
svm-unit-test = "0.1.8"
proptest = "1"
# Reference implementations used as the "expected output" oracle for the
# NIST / RFC test-vector coverage in `tests/nist_rfc_vectors.rs`.
sha3 = "0.11"
blake2 = "0.10"
blake3 = "1"
aes = "0.9"

[[bench]]
name = "groth16"
harness = false

[lints]
workspace = true

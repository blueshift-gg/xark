[package]
name = "xark-keccak"
description = "Keccak-256 gadget for xark zero-knowledge circuits."
keywords = ["zero-knowledge", "zk", "cryptography", "circuit", "groth16"]
categories = ["cryptography"]
readme = "README.md"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[lib]
name = "xark_keccak"
path = "src/lib.rs"

[dependencies]
xark = { path = "../../crates/lang", version = "0.2.2" }
xark-bits = { path = "../xark-bits", version = "0.2.2" }
xark-hash = { path = "../xark-hash", version = "0.2.2" }

[package]
name = "xtask"
description = "xark's repository tasks: `cargo xtask digests | difftest | publish | wasm`."
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
xark-frontend = { path = "../crates/frontend" }
xark-ir = { path = "../crates/ir" }

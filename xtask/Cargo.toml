[package]
name = "xtask"
description = "xark's repository tasks: `cargo xtask digests | difftest | lean-export | publish | wasm`."
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
num-bigint = "0.4"
serde_json = "1"
sha2.workspace = true
xark-frontend.workspace = true
xark-ir.workspace = true

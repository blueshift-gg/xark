[workspace]
resolver = "2"
members = [
    "crates/acir-r1cs",
    "crates/backend",
    "crates/cli",
    "crates/verifier",
    "crates/tests",
]
# The reference Solana program lives under `crates/verifier/reference-program/`
# but is *intentionally* kept out of the workspace: it's only built via
# `cargo-build-sbf` (with its own pinned `Cargo.lock`) as the
# reproducible-build target. See `docs/reproducible-build.md`.
exclude = [
    "crates/verifier/reference-program",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/blueshift/xark"
rust-version = "1.85"

[workspace.dependencies]
ark-bn254 = { version = "0.6", default-features = false, features = ["curve"] }
ark-ff = { version = "0.6", default-features = false, features = ["parallel"] }
ark-ec = { version = "0.6", default-features = false, features = ["parallel"] }
ark-groth16 = { version = "0.6", default-features = false, features = ["parallel"] }
ark-relations = { version = "0.6", default-features = false }
ark-r1cs-std = { version = "0.6", default-features = false, features = ["parallel"] }
ark-poly = { version = "0.6", default-features = false, features = ["parallel"] }
ark-serialize = { version = "0.6", default-features = false, features = ["derive"] }
ark-std = { version = "0.6", default-features = false, features = ["parallel"] }
ark-snark = { version = "0.6", default-features = false }

# Pinned to nargo 1.0.0-beta.21 (commit 89a0f0faf3a5f1273c8ac4843b7877882437e277).
# `acir` re-exports the `acir_field` / `acvm` types and pulls them in at the
# same pinned commit, so we only need to declare `acir` here.
acir = { git = "https://github.com/noir-lang/noir.git", tag = "v1.0.0-beta.21", default-features = false, features = ["bn254"] }

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
base64 = "0.22"
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.11.0"
# Pinned to 0.8 / 0.3 to match arkworks 0.6, which depends on rand 0.8
# (rand_core 0.6). RNGs handed to `Groth16::prove` / `circuit_specific_setup`
# must implement *that* `RngCore`; rand 0.9/0.10 expose an incompatible trait.
rand = "0.8"
rand_chacha = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# `target_os = "solana"` / `target_arch = "bpf"` are Solana-toolchain-only cfg
# values; declare them so upstream rustc's `unexpected_cfgs` lint (1.80+) doesn't
# fire when host CI compiles the `#[cfg(target_os = "solana")] no_std` crates.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
    'cfg(kani)',
] }

[profile.release]
lto = "thin"
codegen-units = 1
